version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploaded:/app/uploaded
      - ./household_power_consumption_with_tariff.csv:/app/household_power_consumption_with_tariff.csv
      - fastembed-cache:/root/.cache/fastembed
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
    container_name: energyiq-backend
    restart: always

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    container_name: energyiq-ollama
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - ollama
    container_name: energyiq-frontend
    restart: always

volumes:
  ollama-data:
  fastembed-cache:
